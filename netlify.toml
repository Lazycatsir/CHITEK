# ── 缓存策略（2026-10-15 Phase1-1.4）──
# 只声明两条互不重叠的规则，刻意不加 `/*` 通配：
# Netlify 对 HTML 本来就默认 max-age=0, must-revalidate，加通配反而有覆盖
# 下面具体规则的风险。两条规则路径不重叠，行为确定。
#
# /assets/*：自托管字体/图片/PDF/360 帧，文件名不带哈希但内容极少变动。
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /_astro/*：Astro 构建产物，文件名自带内容哈希，可安全 immutable。
# 之前缺这条 → 每次访问都要回源校验，是复访加载慢的主因之一。
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
